spring:
  application:
    name: main-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ewm-db:5433/main}
    username: ${POSTGRES_USER:main_user}
    password: ${POSTGRES_PASSWORD:main_password}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8080}
