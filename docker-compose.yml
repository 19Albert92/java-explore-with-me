services:
  stats-server:
    build: ./stat-service/stat-server
    ports:
      - "9090:9090"
    depends_on:
      stats-db:
          condition: service_healthy
    environment:
      - SERVER_PORT=9090
      - SPRING_DATASOURCE_URL=jdbc:postgresql://stats-db:5432/stats
      - SPRING_DATASOURCE_USERNAME=dbuser
      - SPRING_DATASOURCE_PASSWORD=dbpassword

  stats-db:
    image: postgres:16.1
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=stats
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=dbpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d stats"]

  ewm-service:
    ports:
      - "8080:8080"
    depends_on:
      ewm-db:
        condition: service_healthy
    environment:
      - SERVER_PORT=9090
      - SPRING_DATASOURCE_URL=jdbc:postgresql://stats-db:5433/main
      - SPRING_DATASOURCE_USERNAME=main_user
      - SPRING_DATASOURCE_PASSWORD=main_password

  ewm-db:
    image: postgres:16.1
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=main
      - POSTGRES_USER=main_user
      - POSTGRES_PASSWORD=main_password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U main_user -d main" ]
